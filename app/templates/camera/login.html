<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>SentinelCam SC-4200</title>

    <link rel="stylesheet" href="/static/css/camera.css">

</head>

<body>

<div class="login-box">

    <h1>SentinelCam SC-4200</h1>

    <p>Firmware v3.1.7</p>

    {% if error %}
        <div class="error">

            {{ error }}

        </div>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">

            Login

        </button>

    </form>

</div>

</body>

</html>
